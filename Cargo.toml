[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# tools/ (hob-mcp-test-client) is built only on request (`-p`), so it
# doesn't slow down or block work on the other crates.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/filip-hejsek/hob"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hob-core = { path = "crates/hob-core" }
hob-demo = { path = "crates/hob-demo" }
hob-fs = { path = "crates/hob-fs" }
hob-git = { path = "crates/hob-git" }
hob-gui = { path = "crates/hob-gui" }
hob-headless = { path = "crates/hob-headless" }
hob-mcp = { path = "crates/hob-mcp" }
hob-notes = { path = "crates/hob-notes" }
kettle-jxl = { path = "crates/kettle-jxl" }
kettle-ui = { path = "crates/kettle-ui" }
kettle-ui-demo = { path = "crates/kettle-ui-demo" }
kettle-ui-headless = { path = "crates/kettle-ui-headless" }
kettle-ui-iced = { path = "crates/kettle-ui-iced" }

base64 = "0.22"
blake3 = "1"
dirs = "7"
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
gix = { version = "0.90", default-features = false, features = ["blob-diff", "max-performance", "revision", "sha1", "status"] }
iced = "0.14"
image = { version = "0.25", default-features = false }
jiff = "0.2"
log = "0.4"
png = "0.18"
# Bundled SQLite: no system library to find (see planning/DECISIONS.md).
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

# iced 0.14 with the startup notification fix (iced#3317); see
# planning/ICED_WISHLIST.md. Every iced crate is patched, so there is one
# copy of each.
[patch.crates-io]
iced = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_core = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_debug = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_futures = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_graphics = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_program = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_renderer = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_runtime = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_selector = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_test = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_tiny_skia = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_wgpu = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_widget = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }
iced_winit = { git = "https://github.com/filip-hejsek/iced", branch = "startup-notify" }

# Backtraces keep file and line numbers; no variables for a debugger. Halves
# the size of target/ (see planning/DECISIONS.md).
[profile.dev]
debug = "line-tables-only"
