[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filip-hejsek/hob"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
hob-core = { path = "crates/hob-core" }
hob-demo = { path = "crates/hob-demo" }
hob-gui = { path = "crates/hob-gui" }
hob-headless = { path = "crates/hob-headless" }
hob-mcp = { path = "crates/hob-mcp" }
kettle-ui = { path = "crates/kettle-ui" }
kettle-ui-demo = { path = "crates/kettle-ui-demo" }
kettle-ui-headless = { path = "crates/kettle-ui-headless" }
kettle-ui-iced = { path = "crates/kettle-ui-iced" }

dirs = "7"
futures-channel = "0.3"
futures-core = "0.3"
futures-executor = "0.3"
iced = "0.14"
jiff = "0.2"
log = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

