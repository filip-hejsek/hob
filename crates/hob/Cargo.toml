[package]
name = "hob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

default-run = "hob"

[lints]
workspace = true

[features]
default = ["gui"]
# The window (hob-gui). Without it, hob only runs with `--headless`.
gui = ["dep:hob-gui"]

[dependencies]
dirs.workspace = true
hob-core.workspace = true
hob-demo.workspace = true
hob-fs.workspace = true
hob-git.workspace = true
hob-gui = { workspace = true, optional = true }
hob-headless.workspace = true
hob-notes.workspace = true
