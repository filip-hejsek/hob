[package]
name = "hob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# build.rs (a link to ../../build/commit.rs) sets HOB_COMMIT, for
# --version. It's left out of the published package.
exclude = ["build.rs"]
# Not on crates.io (see planning/DECISIONS.md).
publish = false

default-run = "hob"

[dependencies]
dirs = { workspace = true, optional = true }
hob-core.workspace = true
hob-demo = { workspace = true, optional = true }
hob-fs = { workspace = true, optional = true }
hob-git = { workspace = true, optional = true }
hob-gui = { workspace = true, optional = true }
hob-headless.workspace = true
hob-notes = { workspace = true, optional = true }

[features]
default = ["gui", "demo", "fs", "git", "notes"]
# The window (hob-gui). Without it, hob only runs with `--headless`.
gui = ["dep:hob-gui", "dep:dirs"]
# Command sets, one per crate.
demo = ["dep:hob-demo"]
fs = ["dep:hob-fs"]
git = ["dep:hob-git"]
notes = ["dep:hob-notes", "dep:dirs"]

[lints]
workspace = true
