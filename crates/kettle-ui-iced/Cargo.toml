[package]
name = "kettle-ui-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "iced backend for kettle-ui islands, and the kettle-render tool"
repository.workspace = true
license.workspace = true
keywords = ["forms", "gui", "iced", "ui"]
categories = ["gui"]
# build.rs (a link to ../../build/commit.rs) sets HOB_COMMIT, for
# --version. It's left out of the published package.
exclude = ["build.rs"]

[dependencies]
futures-executor.workspace = true
iced = { workspace = true, features = ["advanced", "fira-sans", "image-without-codecs"] }
kettle-ui.workspace = true
png.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures-channel.workspace = true
iced_test = "0.14"

[lints]
workspace = true
