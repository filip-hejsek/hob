[package]
name = "hob-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP server that lets an AI agent use hob through its headless frontend"
repository.workspace = true
license.workspace = true
keywords = ["agent", "ai", "mcp", "shell"]
categories = ["command-line-utilities", "development-tools"]
# build.rs (a link to ../../build/commit.rs) sets HOB_COMMIT, for
# --version. It's left out of the published package.
exclude = ["build.rs"]

[[test]]
harness = false
name = "bridge"

[dependencies]
base64.workspace = true
hob-core.workspace = true
hob-headless.workspace = true
image = { workspace = true, features = ["jpeg", "png"] }
kettle-ui.workspace = true
kettle-ui-headless.workspace = true
serde.workspace = true
serde_json.workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
