[package]
name = "hob-mcp-test-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Streamable HTTP and OAuth, for remote servers. Without it, only servers
# started as a child process (stdio) can be used.
http = ["rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest", "rmcp/auth"]

[dependencies]
dirs.workspace = true
hob-core.workspace = true
hob-gui.workspace = true
kettle-ui.workspace = true
log.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
futures-executor.workspace = true
kettle-ui-headless.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }

[[test]]
name = "commands"
harness = false
