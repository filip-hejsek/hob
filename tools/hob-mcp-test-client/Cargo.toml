[package]
name = "hob-mcp-test-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Sets HOB_COMMIT, for --version.
build = "../../build/commit.rs"
publish.workspace = true

[[test]]
harness = false
name = "commands"

[dependencies]
base64.workspace = true
dirs.workspace = true
hob-core.workspace = true
hob-gui.workspace = true
kettle-ui.workspace = true
log.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
futures-executor.workspace = true
kettle-ui-headless.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }

[features]
default = []
# Streamable HTTP and OAuth, for remote servers. Without it, only servers
# started as a child process (stdio) can be used.
http = ["rmcp/auth", "rmcp/reqwest", "rmcp/transport-streamable-http-client-reqwest"]

[lints]
workspace = true
